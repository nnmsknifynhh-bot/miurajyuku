<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>がんばりレポート｜三浦塾</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body>
  <main class="rp-wrap">
    <p class="error" id="rp-error" hidden></p>
    <canvas id="rp-card" width="1080" height="1560" hidden aria-label="がんばりレポート"></canvas>
    <div class="rp-actions" id="rp-actions" hidden>
      <button class="btn" id="rp-save">📷 画像で保存</button>
      <button class="btn secondary" id="rp-share" hidden>📤 共有（LINE など）</button>
    </div>
    <p class="rp-note" id="rp-note" hidden>このページは、三浦塾からお知らせしたリンクを知っている方だけが見られます。</p>
  </main>
  <script src="/js/compat.js"></script>
  <script src="/shared/map.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
