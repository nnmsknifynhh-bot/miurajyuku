<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>三浦塾 オンライン教室</title>
  <meta name="theme-color" content="#2f7de1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="world">
  <canvas id="world" aria-label="塾の2Dマップ"></canvas>

  <header class="hud-top">
    <div class="place" id="place"><span class="place-icon">📍</span><span id="place-name">ロビー</span><span id="place-cap" class="place-cap"></span></div>
    <button class="me-btn" id="me-btn" aria-haspopup="menu"><span class="dot" id="me-dot"></span><span id="me-name"></span><span class="badge" id="me-role"></span></button>
  </header>
  <div class="stage-note" id="stage-note">テスト版（第4段階まで）</div>
  <div class="class-bar" id="class-bar" hidden></div>

  <section class="screen-view" id="screen-view" hidden>
    <div class="screen-head"><span id="screen-title">🖥 先生の画面</span><button id="screen-big">⛶ 大きく</button></div>
    <video id="screen-video" autoplay playsinline muted></video>
  </section>
  <div id="lk-audio" hidden></div>

  <!-- 自習室：勉強内容の吹き出し -->
  <dialog id="topic-dialog">
    <form class="dialog-body" id="topic-form">
      <h2 id="topic-title">💬 吹き出しに書く</h2>
      <div class="topic-chips" id="topic-chips"></div>
      <label class="field">内容（24文字まで）<input id="topic-input" maxlength="24" placeholder="例：数学　連立方程式" autocomplete="off"></label>
      <p class="muted">アバターの上に吹き出しで表示されます（みんなに見えます）。部屋を移動しても、消すまで表示されたままです。</p>
      <div class="dialog-actions">
        <button type="button" class="btn secondary" id="topic-clear">吹き出しを消す</button>
        <button type="button" class="btn secondary" id="topic-cancel">やめる</button>
        <button type="submit" class="btn">表示する</button>
      </div>
    </form>
  </dialog>

  <!-- 自習室の見守り写真（生徒） -->
  <div class="sc-card" id="sc-card" hidden>
    <b>📷 自習の見守り</b>
    <p>自習室では、ときどきカメラの写真が<b>先生にだけ</b>届きます。写真は自習室を出ると消えます。<br>スマホを、自分とノートが写る場所に置いてね。</p>
    <div class="sc-actions"><button class="btn secondary small" id="sc-later">あとで</button><button class="btn small" id="sc-start">カメラをオンにする</button></div>
  </div>
  <div class="sc-badge" id="sc-badge" hidden>
    <video id="sc-preview" autoplay playsinline muted></video>
    <div><b id="sc-status"></b><small id="sc-sub"></small></div>
    <button id="sc-flip" title="カメラを切りかえ">🔄</button>
    <button id="sc-toggle"></button>
  </div>
  <dialog id="sc-photo-dialog">
    <div class="dialog-body">
      <h2 id="sc-photo-title"></h2>
      <img id="sc-photo-big" alt="">
      <div class="dialog-actions"><button class="btn secondary" id="sc-photo-close">とじる</button></div>
    </div>
  </dialog>

  <!-- 第4段階：個別通話 -->
  <div class="pc-ring" id="pc-ring" hidden></div>
  <dialog id="pc-incoming" class="pc-incoming">
    <div class="dialog-body">
      <div class="pc-bell">📞</div>
      <h2 id="pc-in-title">先生から、個別通話のおさそいです</h2>
      <p>参加すると、先生とふたりだけで話せます。ほかの人には聞こえません。<br>（そのあいだ、授業の音声は止まります）</p>
      <p class="muted" id="pc-in-count"></p>
      <div class="dialog-actions">
        <button class="btn secondary" id="pc-decline">あとで</button>
        <button class="btn" id="pc-accept">参加する</button>
      </div>
    </div>
  </dialog>
  <section class="pc-overlay" id="pc-overlay" hidden>
    <header class="pc-head"><div><b id="pc-title"></b><small id="pc-sub"></small></div></header>
    <div class="pc-stage">
      <div class="pc-peer-wrap" id="pc-peer-wrap"><div class="pc-peer" id="pc-peer"></div></div>
      <div class="pc-video-wrap" id="pc-video-wrap" hidden><video id="pc-video" autoplay playsinline muted></video><span id="pc-video-label"></span></div>
      <video id="pc-local" class="pc-local" autoplay playsinline muted hidden></video>
    </div>
    <div class="pc-status" id="pc-status"></div>
    <div class="pc-controls" id="pc-controls"></div>
    <div id="pc-audio" hidden></div>
  </section>
  <div class="conn" id="conn" hidden>サーバーにつないでいます…</div>

  <nav class="me-menu" id="me-menu" hidden>
    <a href="/admin" id="menu-admin" hidden>⚙️ 管理画面</a>
    <button id="menu-sound">🔈 音のテスト</button>
    <button id="menu-password">🔑 パスワードを変える</button>
    <button id="menu-logout">🚪 ログアウト</button>
    <small class="menu-ver" id="menu-ver"></small>
  </nav>

  <div class="zoom">
    <button id="zoom-in" aria-label="大きくする">＋</button>
    <button id="zoom-out" aria-label="小さくする">－</button>
  </div>

  <div class="joystick" id="joystick" hidden><div class="knob" id="knob"></div></div>

  <footer class="hud-bottom">
    <button class="big-btn" id="btn-rooms"><span>🏫</span><b>へや</b></button>
    <button class="big-btn" id="btn-sit"><span>🪑</span><b id="sit-label">すわる</b></button>
    <button class="big-btn student-only" id="btn-hand"><span>✋</span><b id="hand-label">手をあげる</b></button>
    <button class="big-btn" id="btn-topic"><span>💬</span><b>吹き出し</b></button>
    <button class="big-btn student-only" id="btn-react"><span>😊</span><b>スタンプ</b></button>
    <button class="big-btn staff-only" id="btn-hands"><span>🙋</span><b>挙手</b><i class="count" id="hands-count" hidden>0</i></button>
    <button class="big-btn staff-only" id="btn-people"><span>👥</span><b>入室者</b></button>
  </footer>

  <div class="react-pop" id="react-pop" hidden></div>

  <!-- 先生・オーナー用パネル -->
  <aside class="panel" id="panel" hidden>
    <div class="panel-tabs">
      <button data-tab="hands" class="active">🙋 挙手</button>
      <button data-tab="people">👥 入室者</button>
      <button data-tab="study" id="tab-study-btn" hidden>📷 自習室</button>
      <button id="panel-close" aria-label="とじる">✕</button>
    </div>
    <div class="panel-body" id="panel-hands"></div>
    <div class="panel-body" id="panel-people" hidden></div>
    <div class="panel-body" id="panel-study" hidden></div>
  </aside>

  <div class="user-pop" id="user-pop" hidden></div>

  <dialog id="rooms-dialog">
    <div class="dialog-body">
      <h2>どこへ行く？</h2>
      <div class="room-list" id="room-list"></div>
      <div class="dialog-actions"><button class="btn secondary" id="rooms-close">とじる</button></div>
    </div>
  </dialog>

  <dialog id="pw-dialog">
    <form class="dialog-body" id="pw-form">
      <h2>パスワードを変える</h2>
      <label class="field">今のパスワード<input type="password" id="pw-current" autocomplete="current-password" required></label>
      <label class="field">新しいパスワード<input type="password" id="pw-new" autocomplete="new-password" minlength="8" required><small>8文字以上</small></label>
      <p class="error" id="pw-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn secondary" id="pw-cancel">やめる</button>
        <button type="submit" class="btn">変更する</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/livekit-client.umd.js"></script>
  <script src="/shared/map.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/classcall.js"></script>
  <script src="/js/privatecall.js"></script>
  <script src="/js/studycam.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
